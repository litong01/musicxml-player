<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <meta name="description" content="Play and view MusicXML scores with synchronized playback">
    <meta name="theme-color" content="#b8860b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MusicXML">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.svg">
    <link rel="icon" type="image/svg+xml" href="icon-192.svg">
    <title>MusicXML Player</title>
    <style>
      /* Suppress CSS pointer-events warnings from OSMD */
      g[pointer-events] {
        pointer-events: all !important;
      }
      
      body {
        background-color: white;
        overflow-x: none;
        margin: 0;
        padding: 0;
      }
      .hide {
        display: none;
      }
      #header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background-color: white;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1001;
        border-bottom: 2px solid #b8860b;
      }
      #header h1 {
        margin: 0;
        font-size: 1.5em;
      }
      #settings-btn {
        font-size: 1.2em;
        padding: 8px 12px;
        height: 40px;
        width: 40px;
        cursor: pointer;
        background-color: #b8860b;
        color: white;
        border: none;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #settings-btn:hover {
        background-color: #8b6914;
      }
      #auth-container {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #user-info {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background-color: #f0f0f0;
        border-radius: 5px;
      }
      #user-info.show {
        display: flex;
      }
      #user-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background-color: #b8860b;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }
      #user-name {
        font-size: 0.9em;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .auth-btn {
        padding: 8px 16px;
        background-color: #b8860b;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.9em;
        font-weight: bold;
      }
      .auth-btn:hover {
        background-color: #8b6914;
      }
      .auth-btn.secondary {
        background-color: #d4a574;
      }
      .auth-btn.secondary:hover {
        background-color: #b8860b;
      }
      #subscription-badge {
        padding: 4px 8px;
        background-color: #999;
        color: white;
        border-radius: 3px;
        font-size: 0.7em;
        font-weight: bold;
        text-transform: uppercase;
      }
      #subscription-badge.premium {
        background-color: #ff9800;
      }
      #subscription-badge.pro {
        background-color: #9c27b0;
      }
      #auth-container {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #user-info {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background-color: #f0f0f0;
        border-radius: 5px;
      }
      #user-info.show {
        display: flex;
      }
      #user-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background-color: #b8860b;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }
      #user-name {
        font-size: 0.9em;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .auth-btn {
        padding: 8px 16px;
        background-color: #b8860b;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.9em;
        font-weight: bold;
      }
      .auth-btn:hover {
        background-color: #8b6914;
      }
      .auth-btn.secondary {
        background-color: #d4a574;
      }
      .auth-btn.secondary:hover {
        background-color: #b8860b;
      }
      #subscription-badge {
        padding: 4px 8px;
        background-color: #4caf50;
        color: white;
        border-radius: 3px;
        font-size: 0.7em;
        font-weight: bold;
        text-transform: uppercase;
      }
      #subscription-badge.free {
        background-color: #999;
      }
      #subscription-badge.premium {
        background-color: #ff9800;
      }
      #subscription-badge.pro {
        background-color: #9c27b0;
      }
      #settings-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 2000;
        overflow-y: auto;
      }
      #settings-modal.show {
        display: block;
      }
      #settings-content {
        background-color: white;
        margin: 50px auto;
        padding: 20px;
        max-width: 600px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      #settings-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      #settings-header h2 {
        margin: 0;
      }
      #close-settings {
        font-size: 1.5em;
        cursor: pointer;
        background: none;
        border: none;
        padding: 5px 10px;
      }
      #close-settings:hover {
        color: #b8860b;
      }
      .settings-section {
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #d4a574;
      }
      .settings-section:last-child {
        border-bottom: none;
      }
      .settings-section label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
      }
      .settings-section input[type="text"],
      .settings-section select,
      .settings-section input[type="file"] {
        width: 100%;
        padding: 8px;
        margin-bottom: 5px;
        box-sizing: border-box;
      }
      .settings-section input[type="number"] {
        width: 80px;
        padding: 5px;
      }
      .settings-section small {
        color: #666;
        display: block;
        margin-top: 5px;
      }
      #player {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .player {
        font-size: 1.2em;
        padding: 8px 12px;
        height: 40px;
        width: 40px;
        cursor: pointer;
        background-color: #b8860b;
        color: white;
        border: none;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .player:hover {
        background-color: #8b6914;
      }
      #error {
        background-color: brown;
        color: lightgray;
        padding: 5px;
        margin-top: 5px;
        border-radius: 3px;
      }
      #sheet-container {
        margin-top: 65px;
        height: calc(100vh - 70px);
      }
      #audio-offset {
        width: 5em;
      }
    </style>
    <link rel="stylesheet" href="build/musicxml-player.css">
    <script type="module" src="demo.mjs?v=19"></script>
  </head>
  <body>
    <div id="header">
      <svg width="40" height="40" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" title="MusicXML Player">
        <!-- Musical note -->
        <path d="M70 20 L70 65 Q70 75 60 75 Q50 75 50 65 Q50 55 60 55 Q65 55 70 58 L70 30 L85 25 L85 53 Q85 63 75 63 Q65 63 65 53 Q65 43 75 43 Q80 43 85 46 L85 20 Z" 
              fill="#b8860b" stroke="#8b6914" stroke-width="2"/>
        <!-- Staff lines -->
        <line x1="15" y1="35" x2="45" y2="35" stroke="#b8860b" stroke-width="1.5"/>
        <line x1="15" y1="42" x2="45" y2="42" stroke="#b8860b" stroke-width="1.5"/>
        <line x1="15" y1="49" x2="45" y2="49" stroke="#b8860b" stroke-width="1.5"/>
        <line x1="15" y1="56" x2="45" y2="56" stroke="#b8860b" stroke-width="1.5"/>
        <line x1="15" y1="63" x2="45" y2="63" stroke="#b8860b" stroke-width="1.5"/>
        <!-- Treble clef -->
        <path d="M25 45 Q25 38 30 35 Q32 38 30 42 Q28 45 25 45 M30 42 L30 60 Q28 65 25 65 Q22 65 22 62 Q22 59 25 59 Q27 59 28 60" 
              fill="none" stroke="#b8860b" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div id="player">
        <button class="player" id="prev" title="Previous song" style="display: none;">⏮️</button>
        <button class="player" id="rewind">⏮</button>
        <button class="player" id="pause">⏸</button>
        <button class="player" id="play">▶</button>
        <button class="player" id="next" title="Next song" style="display: none;">⏭️</button>
      </div>
      <div id="playlist-info" style="display: none; font-size: 0.85em; color: #b8860b; margin-left: 10px;"></div>
      <div id="auth-container">
        <!-- User info (shown when logged in) -->
        <div id="user-info">
          <div id="user-avatar"></div>
          <div>
            <div id="user-name"></div>
            <div id="subscription-badge" class="free">Free</div>
          </div>
        </div>
        
        <!-- Auth buttons (shown when logged out) -->
        <button id="login-btn" class="auth-btn" style="display: none;">Login</button>
        <button id="register-btn" class="auth-btn secondary" style="display: none;">Sign Up</button>
        <button id="logout-btn" class="auth-btn" style="display: none;">Logout</button>
        
        <button id="settings-btn" title="Settings">⚙️</button>
      </div>
    </div>

    <div id="settings-modal">
      <div id="settings-content">
        <div id="settings-header">
          <h2>Settings</h2>
          <div style="display: flex; gap: 10px;">
            <button id="cancel-settings" style="padding: 8px 16px; background-color: #999; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Cancel</button>
            <button id="apply-settings" style="padding: 8px 16px; background-color: #b8860b; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Apply</button>
          </div>
        </div>

        <div class="settings-section">
          <div style="font-weight: bold; margin-bottom: 15px;">Select music source</div>
          
          <div style="margin-left: 20px;">
            <div style="margin-bottom: 15px;">
              <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer;">
                <input type="radio" name="music-source" value="samples" id="source-samples" style="margin-top: 4px;"/>
                <div style="flex: 1;">
                  <div style="font-weight: bold; font-size: 0.9em; margin-bottom: 5px;">Choose from library</div>
                  <select id="samples" style="width: 100%;">
                    <option value="">-- Loading... --</option>
                  </select>
                </div>
              </label>
            </div>

            <div style="margin-bottom: 15px;">
              <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer;">
                <input type="radio" name="music-source" value="upload" id="source-upload" style="margin-top: 4px;"/>
                <div style="flex: 1;">
                  <div style="font-weight: bold; font-size: 0.9em; margin-bottom: 5px;">Upload music XML file</div>
                  <input type="file" id="upload" name="upload" multiple style="width: 100%;"/>
                  <small>Supports .mxl, .musicxml, or .mid files</small>
                </div>
              </label>
            </div>

            <div style="margin-bottom: 15px;">
              <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer;">
                <input type="radio" name="music-source" value="url" id="source-url" style="margin-top: 4px;"/>
                <div style="flex: 1;">
                  <div style="font-weight: bold; font-size: 0.9em; margin-bottom: 5px;">Load from URL</div>
                  <input type="text" id="ireal" name="ireal" placeholder="https://example.com/song.musicxml or https://example.com/song.mxl" style="width: 100%;"/>
                  <small>Supports Google Drive sharing links</small>
                </div>
              </label>
            </div>

            <div>
              <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer;">
                <input type="radio" name="music-source" value="playlist" id="source-playlist" style="margin-top: 4px;"/>
                <div style="flex: 1;">
                  <div style="font-weight: bold; font-size: 0.9em; margin-bottom: 5px;">Select from playlists</div>
                  <div style="display: flex; align-items: center; gap: 10px;">
                    <select id="active-playlist" style="flex: 1; padding: 5px;">
                      <option value="">None (single song)</option>
                    </select>
                    <button id="manage-playlists-btn" style="padding: 8px 16px; background-color: #b8860b; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; white-space: nowrap;">Manage Playlists</button>
                  </div>
                </div>
              </label>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 10px;">
            <label style="margin: 0; font-weight: bold;">Renderer:</label>
            <div style="display: flex; gap: 15px;">
              <label for="renderer-vrv" style="display: flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer;">
                <input type="radio" id="renderer-vrv" name="renderer" value="vrv"/>
                Verovio
              </label>
              <label for="renderer-osmd" style="display: flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer;">
                <input type="radio" id="renderer-osmd" name="renderer" value="osmd"/>
                OpenSheetMusicDisplay
              </label>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label for="respect-line-breaks" style="display: flex; align-items: center; gap: 5px; margin: 0; cursor: pointer;">
              <span style="font-weight: bold;">Use line breaks</span>
              <input type="checkbox" id="respect-line-breaks" name="respect-line-breaks"/>
            </label>
            <label for="show-measure-numbers" style="display: flex; align-items: center; gap: 5px; margin: 0; cursor: pointer;">
              <span style="font-weight: bold;">Show measure numbers</span>
              <input type="checkbox" id="show-measure-numbers" name="show-measure-numbers"/>
            </label>
          </div>
        </div>

        <div class="settings-section">
          <div style="font-weight: bold; margin-bottom: 10px;">Band accompaniment</div>
          <div style="display: flex; gap: 15px; margin-left: 20px;">
            <label for="accompaniment-solo" style="display: flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer;">
              <input type="radio" id="accompaniment-solo" name="accompaniment" value="solo-only" checked/>
              Solo only
            </label>
            <label for="accompaniment-band" style="display: flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer;">
              <input type="radio" id="accompaniment-band" name="accompaniment" value="band-only"/>
              Band only
            </label>
            <label for="accompaniment-both" style="display: flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer;">
              <input type="radio" id="accompaniment-both" name="accompaniment" value="solo-and-band"/>
              Solo + Band
            </label>
          </div>
        </div>

        <div class="settings-section">
          <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <label for="velocity" style="margin: 0; font-weight: bold;">Velocity:</label>
              <input type="number" id="velocity" name="velocity" value="1" min="0.25" max="2" step="0.25" style="width: 70px;"/>
            </div>
            
            <div style="display: flex; align-items: center; gap: 8px;">
              <label for="repeat" style="margin: 0; font-weight: bold;">Repeat:</label>
              <select id="repeat" name="repeat" style="width: auto; padding: 5px;">
                <option value="0">No</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="-1">∞</option>
              </select>
              <span>times</span>
            </div>

            <label for="option-mute" style="display: flex; align-items: center; gap: 5px; margin: 0; cursor: pointer;">
              <span style="font-weight: bold;">Mute</span>
              <input type="checkbox" class="option" id="option-mute" value="mute"/>
            </label>

            <label for="option-metronome" style="display: flex; align-items: center; gap: 5px; margin: 0; cursor: pointer;">
              <span style="font-weight: bold;">Metronome</span>
              <input type="checkbox" class="option" id="option-metronome" value="metronome"/>
            </label>
          </div>
        </div>

        <div class="settings-section">
          <span id="error"></span>
          <span id="download-musicxml"></span>
          <span id="download-midi"></span>
        </div>
      </div>
    </div>

    <!-- Playlist Management Modal -->
    <div id="playlist-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 3000; overflow-y: auto;">
      <div style="background-color: white; margin: 50px auto; padding: 20px; max-width: 700px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="margin: 0;">Manage Playlists</h2>
          <button id="close-playlist-modal" style="font-size: 1.5em; cursor: pointer; background: none; border: none; padding: 5px 10px;">✕</button>
        </div>

        <div style="margin-bottom: 20px;">
          <button id="create-playlist-btn" style="padding: 8px 16px; background-color: #b8860b; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">+ Create New Playlist</button>
        </div>

        <div id="playlists-container" style="margin-bottom: 20px;">
          <!-- Playlists will be dynamically inserted here -->
        </div>

        <!-- Create/Edit Playlist Form -->
        <div id="playlist-form" style="display: none; border: 2px solid #b8860b; padding: 15px; border-radius: 8px; margin-top: 20px;">
          <h3 id="playlist-form-title" style="margin-top: 0;">Create New Playlist</h3>
          
          <div style="margin-bottom: 15px;">
            <label for="playlist-name" style="font-weight: bold; display: block; margin-bottom: 5px;">Playlist Name:</label>
            <input type="text" id="playlist-name" placeholder="My Playlist" style="width: 100%; padding: 8px; box-sizing: border-box;"/>
          </div>

          <div style="margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Music URLs:</label>
            <div id="playlist-urls" style="margin-bottom: 10px;">
              <!-- URL inputs will be dynamically added here -->
            </div>
            <button id="add-url-btn" style="padding: 6px 12px; background-color: #d4a574; color: white; border: none; border-radius: 5px; cursor: pointer;">+ Add URL</button>
          </div>

          <div style="display: flex; gap: 10px;">
            <button id="save-playlist-btn" style="padding: 8px 16px; background-color: #b8860b; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Save Playlist</button>
            <button id="cancel-playlist-btn" style="padding: 8px 16px; background-color: #999; color: white; border: none; border-radius: 5px; cursor: pointer;">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <div id="sheet-container"></div>
  </body>
</html>
